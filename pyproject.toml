[project]
name = "paper-token-maker"
version = "2.0.0"
description="Makes double sided paper tokens"
authors = [
    { name = "EamonnCarson", email = "EamonnCarson@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11"
url="https://github.com/EamonnCarson/paper_token_maker"

dependencies = [
    'pillow',
    'reportlab',
    'pyyaml',
    'tqdm',
    'pydantic',
    'pydantic-extra-types[Color]',
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
paper_token_maker="paper_token_maker.main:main"
